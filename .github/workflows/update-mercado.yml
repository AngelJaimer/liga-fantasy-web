name: Actualizar índice de mercado

on:
  schedule:
    # 03:00 UTC ≈ poco después de que FútbolFantasy.com recalcule el
    # mercado a las 00:17 hora española (CET/CEST según época del año).
    - cron: "0 3 * * *"
  workflow_dispatch: {}

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Scrapear mercado
        run: node scripts/scrape-mercado.mjs

      - name: Commitear si hay cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/mercado.json
          git diff --cached --quiet && echo "Sin cambios en el mercado" || git commit -m "chore: actualizar mercado $(date -u +%F)"
          git push
